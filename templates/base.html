<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10121b">

  <title>{% block title %}{% block titulo %}Cinépolis | Cine en grande{% endblock %}{% endblock %}</title>

  <link rel="stylesheet"
        href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
  <link rel="stylesheet"
        href="{{ url_for('static', filename='estilos.css') }}">

  {% block estilos %}{% endblock %}
</head>
<body class="cine-body">

  <nav class="navbar navbar-expand-lg navbar-dark cine-navbar sticky-top"
       aria-label="Menú principal">
    <div class="container">
      <a class="navbar-brand cine-logo" href="{{ url_for('inicio') }}">
        <span>CINÉ</span>POLIS
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#menuPrincipal"
              aria-controls="menuPrincipal"
              aria-expanded="false"
              aria-label="Abrir o cerrar menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="menuPrincipal">
        <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('inicio') }}">Inicio</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('agregar') }}">Agregar película</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('peliculas_registradas') }}">Películas registradas</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('ayuda') }}">Ayuda</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  

  <main class="container cine-main">
    {% block content %}{% block contenido %}{% endblock %}{% endblock %}
  </main>

  <footer class="cine-footer">
    <div class="container">
      <div class="d-flex flex-column flex-md-row justify-content-between gap-2">
        <span><strong>CINÉPOLIS</strong> · Aplicaciones Web · Práctica 05</span>
        <span>Vive la magia del cine</span>
      </div>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='bootstrap/js/bootstrap.bundle.min.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
