{% extends "base.html" %}

{% block title %}Editar película | Cinépolis{% endblock %}
{% block titulo %}Editar película{% endblock %}

{% block content %}

<div class="container mt-4">
    <h2>Editar película</h2>{% if mensaje_error %}
<div class="alert alert-danger">{{ mensaje_error }}</div>
{% endif %}

<form method="POST" action="{{ url_for('editar', id=pelicula._id) }}">
    <div class="mb-3">
        <label class="form-label">Título</label>
        <input type="text" name="nombre" class="form-control"
               value="{{ pelicula.get('nombre', pelicula.get('titulo', '')) }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Género</label>
        <input type="text" name="categoria" class="form-control"
               value="{{ pelicula.get('categoria', pelicula.get('genero', '')) }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Duración (minutos)</label>
        <input type="number" name="duracion" class="form-control"
               value="{{ pelicula.get('duracion', '') }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Estado</label>
        <select name="estado" class="form-select">
            <option value="Disponible" {% if pelicula.get('estado') == 'Disponible' %}selected{% endif %}>Disponible</option>
            <option value="Agotado" {% if pelicula.get('estado') == 'Agotado' %}selected{% endif %}>Agotado</option>
        </select>
    </div>

    <button type="submit" class="btn btn-primary">Guardar cambios</button>
    <a href="{{ url_for('peliculas_registradas') }}" class="btn btn-secondary">Cancelar</a>
</form>

</div>
{% endblock %}
